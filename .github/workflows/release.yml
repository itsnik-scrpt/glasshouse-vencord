# Builds Vencord with Glasshouse inside it and publishes the files as the "build" release.
# Installed copies check that release and update themselves from it.
#
# Runs on every push to main, and once a day to pick up new Vencord versions (Vencord is
# what keeps working when Discord changes, so it has to stay current).

name: Release build

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get Glasshouse
        uses: actions/checkout@v4
        with:
          path: glasshouse

      - name: Get Vencord
        id: vencord
        run: |
          git clone --depth 1 https://github.com/Vendicated/Vencord vencord
          echo "rev=$(git -C vencord rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The Vencord version each build used is recorded in the repository. A new Vencord
      # version therefore becomes a commit here, which is what installed copies compare.
      - name: Record the Vencord version
        id: record
        working-directory: glasshouse
        env:
          REV: ${{ steps.vencord.outputs.rev }}
        run: |
          if [ "$(cat .vencord-rev 2>/dev/null)" = "$REV" ]; then
            if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
          else
            echo "$REV" > .vencord-rev
            git config user.name "itsnik-scrpt"
            git config user.email "252664117+itsnik-scrpt@users.noreply.github.com"
            git add .vencord-rev
            git commit -m "Build against Vencord ${REV:0:7}"
            git push
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        if: steps.record.outputs.skip != 'true'
        uses: pnpm/action-setup@v4
        with:
          package_json_file: vencord/package.json

      - name: Set up Node
        if: steps.record.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        if: steps.record.outputs.skip != 'true'
        env:
          VENCORD_REMOTE: ${{ github.repository }}
          VENCORD_HASH: ${{ steps.record.outputs.short }}
        run: |
          mkdir -p vencord/src/userplugins
          rsync -a --exclude .git --exclude .github glasshouse/ vencord/src/userplugins/glasshouse/
          cd vencord
          pnpm install --frozen-lockfile
          pnpm build --standalone

      - name: Publish
        if: steps.record.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.record.outputs.sha }}
          SHORT: ${{ steps.record.outputs.short }}
          REV: ${{ steps.vencord.outputs.rev }}
        run: |
          mkdir out
          cp vencord/dist/patcher.js vencord/dist/preload.js vencord/dist/renderer.js vencord/dist/renderer.css out/
          cp glasshouse/theme/Glasshouse.theme.css out/
          cp glasshouse/installer/Glasshouse-Setup.cmd out/

          cd glasshouse
          git tag -f build "$SHA"
          git push -f origin build
          if ! gh release view build > /dev/null 2>&1; then
            gh release create build --title "Glasshouse $SHORT" --latest \
              --notes "Latest build. Download Glasshouse-Setup.cmd and run it to install. Installed copies update from this release on their own."
          fi
          gh release upload build ../out/* --clobber
          # The title's last word is the version installed copies compare against.
          gh release edit build --title "Glasshouse $SHORT" --latest \
            --notes "Latest build, made with Vencord ${REV:0:7}. Download Glasshouse-Setup.cmd and run it to install. Installed copies update from this release on their own."
